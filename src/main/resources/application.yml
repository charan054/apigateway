spring:
  application:
    name: ApiGateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: bank
              uri: ${bank.service.url}
              predicates:
                - Path=/bank/**
            - id: phonepe
              uri: ${phonepe.service.url}
              predicates:
                - Path=/phonepe/**
            - id: product
              uri: ${product.service.url}
              predicates:
                - Path=/product/**
            - id: category
              uri: ${product.service.url}
              predicates:
                - Path=/category/**
            - id: order
              uri: ${order.service.url}
              predicates:
                - Path=/cart/**
            - id: coupons
              uri: ${order.service.url}
              predicates:
                - Path=/coupons/**
            - id: wishlist
              uri: ${order.service.url}
              predicates:
                - Path=/wishlist/**
            # Every other OrderService controller prefix (the storefront and admin dashboard features added since
            # the first three routes above). Keep in sync with OrderService's @RequestMapping prefixes.
            - id: order-other
              uri: ${order.service.url}
              predicates:
                - Path=/addresses/**,/admin/**,/audit/**,/customer/**,/faq/**,/feedback/**,/giftcards/**,/gst/**,/loyalty/**,/ordernotes/**,/pincodes/**,/prefs/**,/questions/**,/referral/**,/savedcart/**,/storecredit/**,/subscriptions/**,/support/**,/waitlist/**
            # Product images uploaded through ProductService are served from its /uploads directory.
            - id: product-uploads
              uri: ${product.service.url}
              predicates:
                - Path=/uploads/**

server:
  port: 9000

# Each downstream service's own address, overridable with an env var (matches the PHONEPE_SERVICE_URL
# convention OrderService already uses for its own Feign client).
bank.service.url: ${BANK_SERVICE_URL:http://localhost:8080}
phonepe.service.url: ${PHONEPE_SERVICE_URL:http://localhost:8081}
product.service.url: ${PRODUCT_SERVICE_URL:http://localhost:8082}
order.service.url: ${ORDER_SERVICE_URL:http://localhost:8083}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
